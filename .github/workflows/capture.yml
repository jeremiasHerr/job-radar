name: Capture jobs

on:
  schedule:
    - cron: "17 10 * * *"   # todos los días 10:17 UTC = 07:17 Argentina
  workflow_dispatch:         # botón "Run workflow" para correrlo a mano

permissions:
  contents: write            # necesario para commitear los JSON

concurrency:
  group: capture
  cancel-in-progress: false  # si una corrida está en curso, la siguiente espera

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Create virtualenv and install dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install -r requirements.txt

      - name: Run pipeline
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: bash data_setup.sh

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/public/data.json frontend/public/summary.json
          if git diff --staged --quiet; then
            echo "Sin cambios en los datos."
          else
            git commit -m "chore: update captured data"
            git pull --rebase
            git push
          fi